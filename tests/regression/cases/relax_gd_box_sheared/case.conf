# The same relaxation from a genuinely triclinic cell: atoms_sheared.xyz is
# atoms.xyz with a 4%/3%/2% affine shear applied to the cell and the positions
# together, so the structure is unchanged up to that strain and the relaxation
# has a shear to undo.
#
# This is the case that exercises the off-diagonal half of the lattice
# gradient, and the transpose in dE/dq = (A A_0^-1)^T dE/dx: with a nearly
# cubic cell A A_0^-1 is nearly symmetric and dropping the transpose costs
# almost nothing, which is how that error survives testing on cubic cells.
#
# REFERENCE=golden for the same reason as relax_gd_box.
DATA=xps_opt
MODE=md
RANKS=1
REFERENCE=golden
LINKS="atoms_sheared.xyz gap_files"
NEEDS="atoms_sheared.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz thermo.log"
