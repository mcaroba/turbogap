# ts+mbd in predict mode. This case did not run at all before: the baseline
# segfaults on it (KNOWN_ISSUES.md #1), which is why REFERENCE=golden -- there
# is no baseline output to compare against, so expected/ pins the behaviour of
# the fix instead.
#
# Characterization only. It asserts that the result does not drift, not that
# it is physically right. Note in particular that ts+mbd returns MBD energies
# with TS-scaled forces, because the force-correction lines in the source are
# commented out; see KNOWN_ISSUES.md #3.
DATA=vdw_P
MODE=predict
RANKS=1
REFERENCE=golden
LINKS="p4_cell.xyz gap_files"
NEEDS="p4_cell.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
