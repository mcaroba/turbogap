# exp_data_weights: the same weighting as xrd_mad_weights, given as one number
# per point of the experimental data file rather than as (q, w) pairs. The two
# keywords are alternatives, and this is the path through
# read_exp_weight_column -- the file is read with no abscissa of its own and
# takes q from the data, so it must be exactly as long as the data file (112
# lines here).
#
# Golden for the same reason as xrd_mad_weights.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat"
