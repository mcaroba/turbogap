# Tkatchenko-Scheffler pairwise vdW. Exercises the Hirshfeld local-property
# path and the vdW energy/force/virial accumulation.
DATA=vdw_P
MODE=predict
RANKS=1
LINKS="p4_dimer.xyz gap_files"
NEEDS="p4_dimer.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
# REFERENCE=golden since the TS self-volume fix (KNOWN_ISSUES 19): the baseline
# binary leaves each atom's own Hirshfeld gradient out of the TS force.
REFERENCE=golden
