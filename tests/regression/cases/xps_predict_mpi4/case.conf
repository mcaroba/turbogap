# Same as xps_predict across 4 ranks: covers the energy/force/virial MPI
# reductions and the site-to-rank decomposition.
# descriptor loop, local properties, 2b/3b/core_pot and the XPS spectrum.
DATA=xps_opt
MODE=predict
RANKS=4
LINKS="atoms.xyz gap_files xps_spectra_interp.dat"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz"
