# The same hybrid MC/MD walk with velocity_distribution = "maxwell", so the
# momenta come from the Maxwell-Boltzmann distribution the Metropolis test
# assumes rather than from the historical uniform-then-rescale draw.
#
# It is the pair with mc_hybrid_md that carries the information: the two decks
# differ in one keyword, and if the two golden outputs ever coincide then the
# keyword has stopped doing anything. tests/velocity_draw checks that the draw
# really is Maxwell-Boltzmann; this checks that the walk uses it and stays
# reproducible.
#
# Hybrid MC/MD: the "md" move type with mc_hamiltonian, so the Metropolis test
# is on E_pot + E_kin and the momenta are redrawn by randomize_velocities
# before each MD burst.
#
# This is the only case that reads E_kinetic in an acceptance ratio.
# randomize_velocities used to add the rescaled kinetic energy to the
# pre-rescaling one instead of replacing it, leaving E_kinetic wrong by
# thousands of eV and rejecting every md move; see KNOWN_ISSUES.md #7.
#
# REFERENCE=golden for the same reason as mc_moves_relax.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="mc.log mc_current.xyz"
