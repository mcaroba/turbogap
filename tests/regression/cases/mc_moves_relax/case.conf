# The MC move set the GCMC tutorial actually uses: insertion, removal, move and
# swap, with a gradient-descent relaxation after each accepted exchange.
#
# This is the first case to drive "swap" (so mc_swaps/mc_swaps_id and
# count_swap_species), and the first to drive mc_relax, which re-enters
# gradient_descent with a different n_sites on every relaxation.
#
# REFERENCE=golden: the baseline cannot produce a reference. Its
# read_options_exp reads an uninitialised substring bound, and on the
# max_Gbytes_per_process line that run.sh appends to every case it takes the
# "*_range/_file_data/_n_samples" branch, backspaces the unit and never reads
# the record -- so the input loop re-presents the same line for ever and the
# run hangs. See KNOWN_ISSUES.md #6.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="mc.log mc_current.xyz"
