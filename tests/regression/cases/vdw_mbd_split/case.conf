# MBD with vdw_mbd_rcut below vdw_2b_rcut, which splits the energy into a
# two-body call at the long cutoff and a many-body call at the short one. The
# only case on that path.
#
# REFERENCE=golden: the baseline binary keeps only the many-body call's forces
# (KNOWN_ISSUES 19).
REFERENCE=golden
DATA=vdw_P
MODE=predict
RANKS=1
LINKS="p4_dimer.xyz gap_files"
NEEDS="p4_dimer.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
