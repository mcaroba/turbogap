# Grand-canonical CO exchange with the molecules identified by their BONDING
# rather than by a record of having inserted them: mc_mol_identify = topology.
#
# The structure is an oxidised graphene sheet with three free CO molecules above
# it, generated by files/make_intercalation.py. It is the intercalation case the
# feature exists for, in the elements the test data has a potential for -- the
# same shape as a guest molecule between oxygenated carbon sheets.
#
# What it demonstrates, and mc_molecule (the tag-mode case) cannot:
#
#   * The three CO molecules that were in the STARTING structure are removable.
#     Under mc_mol_identify = tag they carry no label, so the molecule count
#     starts at zero and a removal move has nothing to choose from -- the run can
#     only take back what it put in. The log here says "topology: 3 removable CO"
#     on the first exchange, before anything has been inserted.
#   * The sheet's two epoxy oxygens are NOT matched. They are the same elements
#     as the guest and are each bonded to carbon, so anything matching on
#     composition would find CO molecules that are not there. They belong to the
#     sheet's 34-atom component, which is not two atoms.
#   * Inserted and pre-existing molecules share one namespace: the count goes to
#     4 after the first accepted insertion rather than restarting.
#
# That last column is not cosmetic. N_mc_species is the N in the grand-canonical
# acceptance ratio, so under tag mode a run that starts with molecules in it does
# not merely refuse to remove them -- it computes the wrong acceptance
# probability for every exchange. mc.log shows the two side by side:
#
#   tag        1  insertion  T  ...  42  CO  1
#   topology   1  insertion  T  ...  42  CO  4
#
# Same structure, same move, same energies; three molecules that one of them
# cannot see.
#
# REFERENCE=golden because the frozen baseline predates the keyword and stops on
# it. Green means unchanged, not correct; what makes it correct is
# tests/topology/, which checks the graph work against structures whose answer
# is known by construction.
REFERENCE=golden
DATA=xps_opt
MODE=mc
RANKS=1
LINKS="gap_files co_molecule.xyz"
NEEDS="gap_files/CO.gap co_molecule.xyz"
OUTPUTS="mc.log mc_current.xyz"
