# MAD against an experimental XRD pattern computed by the Debye scattering
# equation, 91-atom melted graphite-O. Covers the xrd_debye route carrying
# forces through the driver, and the read_input_file rule that switches the
# pdf and structure factor back off when nothing needs them.
#
# REFERENCE=golden because the baseline binary predates the keyword: it exits
# on "I do not recognize the input file keyword xrd_debye" and cannot produce
# a reference at all. Green here means unchanged, not correct. What makes it
# correct is tests/xrd_debye, which checks the pattern against an independent
# Debye sum and the forces and virial against finite differences.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat"
