# Insertions restricted to a slab: mc_n_planes with mc_max_dist_to_planes keeps
# a trial site within a given distance of each named plane, and
# mc_planes_restrict_to_polyhedron switches that to "inside the polyhedron the
# planes bound". This is the geometry used to grow adsorbates on a surface, and
# nothing else in the suite reaches check_if_far_from_planes or
# check_in_polyhedron.
#
# REFERENCE=golden for the same reason as mc_moves_relax.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="mc.log mc_current.xyz"
