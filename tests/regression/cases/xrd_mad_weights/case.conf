# The same MAD run as xrd_mad, with a weight per experimental sample given as
# (q, w) pairs. Weighting the first sharp diffraction peak more heavily is the
# motivating case for the keyword: below q = 1.5 the signal is small, and an
# unweighted sum of squares spends the fit on the large high-q oscillations
# instead.
#
# Golden, because the frozen baseline binary predates exp_weights_files and
# stops on the unknown keyword. Green means the weighting still does what it
# did, not that the weights are the right ones.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat"

# Device tolerance. Frame 0 agrees with the host to the printed digits; the run
# then amplifies that as it does any perturbation. Worst of 3 device runs
# needs 5e-6; shifting the input positions by 1e-9 A needs 2e-3 on the
# host alone (KNOWN_ISSUES 13d).
GPU_RTOL=2e-5
GPU_ATOL=2e-5
