# Grand-canonical MC with XPS spectrum optimization, 40 steps. Insertions and
# removals change n_sites every step, so this covers reallocation and neighbor
# rebuilds along the MC path -- code the predict-only cases never reach.
# Reproducible run-to-run via random_seed (verified).
DATA=xps_opt
MODE=mc
RANKS=1
LINKS="atoms.xyz gap_files xps_spectra_interp.dat"
NEEDS="atoms.xyz gap_files/CO.gap xps_spectra_interp.dat"
OUTPUTS="mc.log mc_all.xyz mc_current.xyz xps_prediction.dat"
