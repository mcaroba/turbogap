# Reverse Monte Carlo: the walk is driven towards agreement with a measured XPS
# spectrum, by adding the mismatch between prediction and data to the energy the
# Metropolis test reads.
#
# Two keywords have to agree for that to happen and they are easy to mistake for
# each other. mc_optimize_exp declares the intent -- and, until this case
# existed, did nothing else but warn about a missing exp_energy_scales.
# exp_energies is what actually folds energies_exp into energies. This deck sets
# both, and mc.log's E_exp columns are the evidence that the experimental term
# reached the acceptance ratio.
#
# gcmc_xps also carries XPS data but leaves exp_energies off, so it prices the
# moves on the potential energy alone; the two cases differ in exactly that.
#
# REFERENCE=golden for the same reason as mc_moves_relax.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files xps_spectra_interp.dat"
NEEDS="atoms.xyz gap_files/CO.gap xps_spectra_interp.dat"
OUTPUTS="mc.log mc_current.xyz xps_prediction.dat"
