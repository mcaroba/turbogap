# Damped-shifted-force electrostatics on an 897-atom carbon cell, with the
# CCLi GAP -- the only potential in the test data that declares an
# atomic_charge local property, and therefore the only way to reach the
# electrostatics code path at all.
#
# Until this case existed, electrostatics had never been run on either branch
# (docs/refactor_strategy.md section 5: "no GAP in the test data declares an
# atomic_charge local property, so the path cannot be exercised on EITHER
# branch"). The first run found two defects in the merged implementation:
# energies_estat and forces_estat were never allocated, so the MPI unpack
# wrote through an unallocated pointer and segfaulted; and once that was
# fixed, neither the energy sum nor the force/virial sum included the estat
# contribution, so the whole thing was silently discarded.
#
# The cell is pure carbon against a C+CLi potential, which is deliberate: it
# is a real equilibrated structure already in the test data, and the C
# descriptor carries atomic_charge, so the path runs end to end with small but
# non-zero charges. estat contributes about -3.2 eV of the total here, which
# is enough that a regression in it moves the answer.
#
# REFERENCE=golden because the baseline binary segfaults on this input --
# that is the defect above. Green means unchanged, not correct.
REFERENCE=golden
DATA=C
MODE=predict
RANKS=1
# The structure comes from C/ and the potential from CLi/. LINKS is resolved
# against $DATA_ROOT/$DATA, and a relative path escapes it, which is how one
# case draws on two data directories without changing run.sh.
LINKS="atoms_897.xyz:atoms.xyz ../CLi/gap_files:gap_files"
NEEDS="atoms_897.xyz ../CLi/gap_files/CCLi_estat_ljrep.gap"
OUTPUTS="trajectory_out.xyz"
