# Grand-canonical exchange of a whole rigid molecule: mc_molecule_files names an
# xyz file, an insertion places a uniformly random orientation of it at a random
# centre of mass, and a removal takes all of its atoms together.
#
# This is the only case where an exchange changes n_sites by more than one, and
# the only one where the removal candidates are molecules rather than atoms --
# so it is what covers the mc_mol_id/mc_mol_mu bookkeeping that survives the
# reallocation, and the compaction that a removal of non-adjacent atoms needs.
#
# It also carries mc_mu_reference = "e0", which adds the exchanged object's e0
# back into the acceptance ratio so that mc_mu is quoted relative to the
# isolated species. For a molecule that is the sum over its atoms, which is the
# part of the option a single-atom deck would not exercise.
#
# tests/mc_mpi_neighbors has the legs that check the neighbour lists come out of
# these exchanges right, at 1, 2 and 4 ranks. This case pins the walk itself.
#
# REFERENCE=golden for the same reason as mc_moves_relax.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files co_molecule.xyz"
NEEDS="atoms.xyz gap_files/CO.gap co_molecule.xyz"
OUTPUTS="mc.log mc_current.xyz"
