# ts+mbd under MD, where the recompute/reuse cycle actually cycles.
# mbd_correction_freq = 2 over 4 steps recomputes the correction at steps 0/2/4
# and *reuses* it at 1/3, so both halves are covered -- including the reuse
# half, which is where the frozen energy and force corrections are applied and
# therefore the only place their staleness can show up.
#
# REFERENCE=golden since the force correction was enabled. This case used to be
# compared bit-for-bit against the baseline binary, and that is no longer
# possible: the baseline computes ts+mbd forces without the correction, which
# is the very thing that changed. Losing that comparison is a real reduction in
# safety for this case, and it is the price of a deliberate behaviour change.
# Everything not involving ts+mbd is still baseline-compared.
DATA=vdw_P
MODE=md
REFERENCE=golden
RANKS=1
LINKS="p4_cell.xyz gap_files"
NEEDS="p4_cell.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
