# ts+mbd, the only mode in which it works (see KNOWN_ISSUES.md: it segfaults in
# predict and mc). Run as MD specifically to reach the correction machinery:
# mbd_correction_freq = 2 over 4 steps recomputes the correction at steps 0/2/4
# and *reuses* it at 1/3, so both branches around turbogap.f90:2279 are covered
# -- including the reuse branch that is unreachable in predict.
#
# Without this case the this_energies_vdw_corr / this_virial_vdw_corr state has
# no coverage at all, and that is precisely the state whose lifetime the
# extraction has to preserve.
DATA=vdw_P
MODE=md
RANKS=1
LINKS="p4_cell.xyz gap_files"
NEEDS="p4_cell.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
