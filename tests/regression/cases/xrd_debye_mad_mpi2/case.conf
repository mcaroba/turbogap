# xrd_debye_mad under 2 ranks. The Debye double sum is split over the outer
# atom index, so this covers the mpi_reduce of the pattern and the claim that
# each rank's derivative slice is already complete for the atoms it owns.
#
# Expected output is stored separately from the 1-rank case because MPI
# reductions are not associative: the two rank counts legitimately differ in
# the last digit or two, and diff has no tolerance.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=2
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat"

# Device tolerance. Frame 0 agrees with the host to the printed digits; the run
# then amplifies that as it does any perturbation. Worst of 2 device runs
# needs 2e-6; shifting the input positions by 1e-9 A needs 1e-3 on the
# host alone (KNOWN_ISSUES 13d).
GPU_RTOL=2e-5
GPU_ATOL=2e-5
