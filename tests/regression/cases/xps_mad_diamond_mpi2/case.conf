# xps_mad_diamond on 2 ranks, and the only case that sends an XPS energy AND
# force through the pack/mpi_reduce/unpack path in turbogap.f90. The XPS
# contribution travels in its own slots there (energies_lp, forces_lp,
# virial_lp), fed by local_properties_cart_der over this rank's pair range --
# j_beg:j_end -- so a mistake in that range, or in the slot numbering, would
# show up here and nowhere else in the suite. xps_predict_mpi4 covers the
# spectrum on several ranks but asks for no forces; gcmc_xps_mpi2 prices its
# moves on the potential energy alone.
#
# Serial and 4-rank runs of this deck differ by at most 2.4e-7 eV in E_pot over
# 5 steps, 7e-11 of it, which is reduction order and not a discrepancy. What
# this case pins is that the two binaries agree with each other at the same rank
# count.
DATA=xps_opt
MODE=md
RANKS=2
LINKS="atoms.xyz gap_files xps_diamond_sp3_285.35.dat"
NEEDS="atoms.xyz gap_files/CO.gap xps_diamond_sp3_285.35.dat"
OUTPUTS="trajectory_out.xyz thermo.log xps_prediction.dat"
