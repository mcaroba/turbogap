# Molecular Augmented Dynamics against an XPS target: the same 512-atom
# amorphous carbon as xps_mad_graphite, driven instead towards diamond, whose
# C1s is a single sp3 line at 285.35 eV.
#
# The pair exists because the two targets differ in exactly one number and pull
# the structure in opposite directions: 284.25 eV is where this potential puts
# a three-fold site and 285.35 eV where it puts a four-fold one. Whichever way
# the XPS gradient is broken, it cannot be broken in a way that satisfies both.
#
# exp_energy_scales differs from the graphite case for a reason worth knowing:
# with squared_diff the term is E_exp = n_sites * gamma * D^2 / 2, and a
# prediction-only probe gives D^2 = 1.2923 against this target against 0.0746
# against the graphite one -- a-C already looks like graphite in XPS and
# nothing like diamond. So a quarter of the 4321.58 eV GAP energy is gamma =
# 3.27 here and 57 there. A shared gamma would mean a 17x stronger bias in this
# case, which is how the structure gets torn apart rather than steered.
#
# neighbors_buffer is pinned because the reference here is the baseline binary,
# which has its own compiled-in default; leaving it unset would compare two
# different skins and move the last digit of every force.
DATA=xps_opt
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xps_diamond_sp3_285.35.dat"
NEEDS="atoms.xyz gap_files/CO.gap xps_diamond_sp3_285.35.dat"
OUTPUTS="trajectory_out.xyz thermo.log xps_prediction.dat"
