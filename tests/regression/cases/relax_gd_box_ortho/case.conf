# The orthorhombic-constrained variable-cell relaxation. Same optimizer as
# relax_gd_box with the off-diagonal lattice gradient projected out, so the
# cell may change its edge lengths but not its angles: the check this case adds
# over relax_gd_box is that every off-diagonal lattice component in thermo.log
# stays exactly zero.
#
# REFERENCE=golden for the same reason as relax_gd_box.
DATA=xps_opt
MODE=md
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz thermo.log"
