# Nested sampling over 91 P4-dimer walkers: four iterations of replacing the
# highest-enthalpy walker with an MD-decorrelated clone of another. The only
# case that reaches nested_step.
#
# REFERENCE=golden: the baseline binary picks the walker to clone from a
# clock-seeded irand() (KNOWN_ISSUES 17), so no two runs of it agree.
REFERENCE=golden
DATA=vdw_P
MODE=predict
RANKS=1
LINKS="p4_dimer.xyz:atoms.xyz gap_files"
NEEDS="p4_dimer.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz thermo.log"
