# Single point with experimental energies but no MAD forces. Covers the
# pdf/sf/xrd forward prediction path, and pins the slot bookkeeping for the
# do_forces-without-exp_forces configuration described in KNOWN_ISSUES.md #4.
DATA=xrd_mad
MODE=predict
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz xrd_prediction.dat pair_distribution_total.dat structure_factor_total.dat"
