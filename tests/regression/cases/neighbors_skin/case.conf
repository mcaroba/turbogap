# The shipped neighbors_buffer, which is 0.5 A and not 0 since the rebuild test
# moved into src/neighbors_skin.f90 and became safe to switch on.
#
# Same body as xrd_mad, which is the case the default moved by the most: it is
# the only one in the suite where the pdf, sf and xrd families carry forces, so
# a change in the order pairs are summed in shows up in the most places.
#
# REFERENCE=golden because no earlier binary can produce a reference for it --
# they all predate the default and would run this input with no skin at all.
# The four cases the default moved -- relax_gd_box, relax_gd_box_ortho, xrd_mad
# and xrd_mad_mpi2 -- pin neighbors_buffer = 0 instead, so their stored
# expectations stay valid; this one covers the default.
#
# Characterization: it asserts the result does not drift, not that it is right.
# What argues it is right is tests/neighbors_skin, which checks the padded pair
# set against brute force, and the single-point comparison across buffers --
# same total energy, forces agreeing to the print precision of the xyz.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat pair_distribution_total.dat structure_factor_total.dat"
