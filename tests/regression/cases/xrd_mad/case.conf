# Molecular Augmented Dynamics against an experimental XRD pattern, 91-atom
# melted graphite-O. The only case in the suite where the pdf, sf and xrd
# contribution families carry forces: exp_forces = .true. is what turns the
# MAD gradient on. Data and method from TurboGAP_School/exp_observables.
#
# Reference is the baseline binary, which runs this input and reproduces it
# bit-identically, so this is a true regression case and not a
# characterization one.
DATA=xrd_mad
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat pair_distribution_total.dat structure_factor_total.dat"
