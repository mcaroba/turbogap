# Molecular Augmented Dynamics against an XPS target: 512-atom amorphous carbon
# driven towards graphite, whose C1s is a single sp2 line at 284.25 eV.
#
# The only configuration in which the XPS contribution carries forces. gcmc_xps
# and mc_reverse_xps price an XPS mismatch into a Metropolis test -- energies
# only -- and xrd_mad carries forces for the pdf, sf and xrd families. The
# local-property gradient behind the XPS force (local_properties_cart_der,
# through get_exp_pred_spectra_energies_forces) had no case at all, and it is
# the gradient the vdW path shares.
#
# exp_energy_scales is calibrated, not guessed: with squared_diff the term is
# E_exp = n_sites * gamma * D^2 / 2 -- every site is given the whole mismatch --
# and a prediction-only probe gives D^2 = 0.2873 here, so gamma = 14.69 puts it
# at a quarter of the 4321.58 eV GAP energy. D^2 against the diamond target is
# 5.9x larger, which is why xps_mad_diamond carries a different number.
#
# Calibrating the energy does not calibrate the force, which is what steers: at
# these gammas the XPS force is 9% of the 1000 K thermal force for this target
# and 1% for the diamond one, because the force scales with gamma and gamma is
# what the larger D^2 shrinks. Force parity is near gamma = 150-210 for both.
# Irrelevant to a five-step coverage case, not to a steering run.
#
# The target file's first and last x set the prediction window: 1.5 eV either
# side of the peak, 7.5 sigma, wide enough that clipping the predicted tails
# costs under 1% of D^2. Narrowing it further discards mismatch rather than
# sharpening it.
#
# neighbors_buffer is pinned because the reference here is the baseline binary,
# which has its own compiled-in default; leaving it unset would compare two
# different skins and move the last digit of every force.
DATA=xps_opt
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files xps_graphite_sp2_284.25.dat"
NEEDS="atoms.xyz gap_files/CO.gap xps_graphite_sp2_284.25.dat"
OUTPUTS="trajectory_out.xyz thermo.log xps_prediction.dat"
