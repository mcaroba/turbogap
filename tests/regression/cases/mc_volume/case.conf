# The "volume" move: an isotropic log-volume trial against a target pressure,
# accepted by monte_carlo_volume. Covers modify_box and the NPT acceptance
# ratio, neither of which any other case reaches.
#
# The N in that ratio's (N+1)ln(V'/V) term used to be read from a chemical
# potential's species count, which a volume move need not configure at all --
# undefined when it is not; see KNOWN_ISSUES.md #8. This deck sets no
# chemical potential, so it is exactly that path.
#
# REFERENCE=golden for the same reason as mc_moves_relax.
DATA=xps_opt
MODE=mc
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="mc.log mc_current.xyz"
