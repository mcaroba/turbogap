# Plain gradient-descent relaxation of the positions, 15 steps. Covers
# gradient_descent itself: the opening step from max_opt_step/max_force, the
# Armijo-Goldstein backtracking line search, and the Barzilai-Borwein step
# length after it.
#
# Compared against the baseline, and expected to stay bit-identical to it. The
# gamma_back0 reuse repaired in gradient_descent only fires when first_step
# recurs, which under `turbogap md` it never does -- so this case is the
# evidence that the repair did not disturb the ordinary MD relaxation path.
DATA=xps_opt
MODE=md
RANKS=1
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz thermo.log"

# Device tolerance. Frame 0 agrees with the host to the printed digits; the run
# then amplifies that as it does any perturbation. Worst of 3 device runs
# needs 1e-5; shifting the input positions by 1e-9 A needs 5e-5 on the
# host alone (KNOWN_ISSUES 13d).
GPU_RTOL=2e-5
GPU_ATOL=2e-5
