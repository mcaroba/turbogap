# The two-rank companion to mad_sf_matrix, and the reason it exists.
#
# refactor_strategy.md section 7.2 flagged get_structure_factor_forces_matrix
# as taking i_beg, i_end and species(i_beg:i_end) on the GPU branch and neither
# here -- "an MPI-decomposition difference in a routine every test exercises
# single-rank, which is exactly the shape of the unexercised multi-rank
# indexing bug". This case is what exercises it.
#
# Measured before adding it: frame-0 forces and the trajectory energy are
# BIT-IDENTICAL between one rank and two on this input, so the concern is
# retired rather than merely unobserved. The routine is decomposed here by the
# slices its caller passes (n_neigh(i_beg:i_end), rjs(j_beg:j_end),
# neighbors_list(j_beg:j_end)) rather than by explicit bounds; the GPU branch
# passes bounds because its kernel needs them. Both decompose.
#
# Expected output is stored per rank count -- MPI reductions are not
# associative, so 1 and 2 ranks may legitimately differ in the last digits even
# where they do not here.
#
# Molecular Augmented Dynamics with the structure-factor MATRIX path, on the
# 897-atom carbon cell. Complements xrd_mad rather than duplicating it: that
# case computes the structure factor directly, this one takes
# structure_factor_from_pdf with structure_factor_matrix and
# structure_factor_matrix_forces, and adds partial pair distributions -- three
# code paths the suite did not otherwise reach.
#
# From dev/mad, reduced from 27000 atoms to the 897-atom cell already in the
# test data so it runs in the suite rather than beside it. The experimental
# target is the same ta-C pattern that example uses.
#
# REFERENCE=golden: the baseline binary predates turbogap_exp.f90 and the
# exp-spectra virial fix, so it cannot serve as a reference for the MAD
# gradient. Green means unchanged, not correct.
REFERENCE=golden
DATA=C
MODE=md
RANKS=2
LINKS="atoms_897.xyz:atoms.xyz gap_files xrd_ta-C_Shang_2021_27_GPa_1000C_hand.fq"
NEEDS="atoms_897.xyz gap_files/carbon.gap xrd_ta-C_Shang_2021_27_GPa_1000C_hand.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat pair_distribution_total.dat pair_distribution_C_C_prediction.dat structure_factor_total.dat structure_factor_C_C_prediction.dat"
