# 5-step MD from explicit velocities, so nothing is randomized and the
# trajectory is reproducible. Covers velocity Verlet, the Berendsen
# thermostat and the per-step neighbor-list rebuild decision.
DATA=CO
MODE=md
RANKS=1
LINKS="atoms_7176_vel.xyz:atoms.xyz gap_files"
NEEDS="atoms_7176_vel.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz"
