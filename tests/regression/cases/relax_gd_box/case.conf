# Variable-cell relaxation: positions and lattice descend together in the
# preconditioned variables of Gubler et al. (2023).
#
# REFERENCE=golden. This is a deliberate algorithm change, not a refactor: the
# baseline alternates between relaxing the positions to convergence and
# relaxing the box to convergence, and on this system the position half never
# reaches its tolerance, so the box half never runs and the cell never moves at
# all. Diffing against it would only record that the two are different.
#
# What the case pins is that the cell does move and that the run drives the
# pressure towards zero. thermo.log carries the lattice vectors (write_lv), so
# a drift in either block shows up here.
DATA=xps_opt
MODE=md
RANKS=1
REFERENCE=golden
LINKS="atoms.xyz gap_files"
NEEDS="atoms.xyz gap_files/CO.gap"
OUTPUTS="trajectory_out.xyz thermo.log"

# Device tolerance. Frame 0 agrees with the host to the printed digits; the run
# then amplifies that as it does any perturbation. Worst of 3 device runs
# needs 1e-5; shifting the input positions by 1e-9 A needs 2e-5 on the
# host alone (KNOWN_ISSUES 13d).
GPU_RTOL=2e-5
GPU_ATOL=2e-5
