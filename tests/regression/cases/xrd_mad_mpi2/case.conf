# xrd_mad on 2 ranks. This is the case that matters most for the reduce
# block in turbogap.f90: it is the only one that sends pdf, sf and xrd
# energies AND forces through the pack/mpi_reduce/unpack path, which is
# where a slot-numbering mistake would silently attribute one family's
# contribution to another.
# REFERENCE=golden since the exp-spectra virial fix: the baseline binary
# computes the structure-factor virial with a stale pair index (see the commit
# that changed get_structure_factor_forces_matrix in exp_utils.f90), so it can
# no longer serve as a reference here. Green means unchanged, not correct --
# what makes it correct is that the GPU build, which never had the bug, agrees
# with this one to 1e-12 on frame 0.
REFERENCE=golden
DATA=xrd_mad
MODE=md
RANKS=2
LINKS="atoms.xyz gap_files xrd_glassy_carbon_zeng_2017.fq"
NEEDS="atoms.xyz gap_files/CO.gap xrd_glassy_carbon_zeng_2017.fq"
OUTPUTS="trajectory_out.xyz thermo.log xrd_prediction.dat pair_distribution_total.dat structure_factor_total.dat"
