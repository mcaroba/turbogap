# MBD on the 108-atom cell across 2 ranks. The Hirshfeld gradient exchange
# between ranks (hirshfeld_transfer / i_send / j_receive) is the most intricate
# MPI code in the vdW block and the likeliest thing an extraction breaks, so it
# gets a dedicated case.
#
# This case would ideally use vdw_type = ts+mbd, which covers more of the block.
# It cannot: ts+mbd segfaults in master HEAD in any mode that leaves
# md_istep = -1 (predict, mc). See tests/regression/KNOWN_ISSUES.md.
DATA=vdw_P
MODE=predict
RANKS=2
LINKS="p4_cell.xyz gap_files"
NEEDS="p4_cell.xyz gap_files/phosphorus.gap"
OUTPUTS="trajectory_out.xyz"
