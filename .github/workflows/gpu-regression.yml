# CI for the GPU branch.
#
# The regression job needs a real GPU, a CUDA toolchain and the CO test data,
# none of which exist on GitHub-hosted runners. It therefore targets a
# self-hosted runner labelled "gpu"; register one with
#
#   ./config.sh --url https://github.com/<owner>/turbogap --labels gpu,cuda
#
# and set the repository variable TURBOGAP_TEST_DATA to a checkout of
# turbogap_tests. Until such a runner exists the job simply
# stays queued/skipped.

name: gpu-regression

on:
  push:
    branches: [gpu_fixes, gpu_clean]
  pull_request:
  workflow_dispatch:

jobs:
  gpu-regression:
    name: GPU regression vs CPU reference
    runs-on: [self-hosted, gpu]
    # Don't block PRs from forks, which cannot reach the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Both, into separate object trees. --gpu compares the device binary
      # against the HOST BUILD OF THE SAME SOURCE, not against the frozen
      # baseline, so the host binary is part of the reference and has to exist
      # at the same time. HOP_ROOT needs no setting -- src/hop is a submodule.
      - name: Build both
        run: |
          make deepclean
          ./compile_cpu.sh
          ./compile_gpu.sh

      # The whole case list, compared numerically: the device build sums the
      # SOAP batches and the cuBLAS reductions in a different order, so a
      # bit-exact diff would call every device run a failure. See
      # tests/regression/compare_tol.py for the tolerance and where it comes
      # from.
      - name: Regression suite, device against host
        env:
          TURBOGAP_DATA_ROOT: ${{ vars.TURBOGAP_TEST_DATA }}
        run: tests/regression/run.sh --gpu

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: /tmp/turbogap_gpu_regression.*/**/*.log
          if-no-files-found: ignore
