[project]
name = "turbogap-mcp"
version = "0.1.0"
description = "MCP server for using TurboGAP: keywords, input validation, runs and a live calculator."
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
turbogap-mcp = "turbogap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbogap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
